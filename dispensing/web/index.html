<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 点胶控制系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2030'/%3E%3Cpath d='M16 4 L23 17 L9 17 Z' fill='%232ad0c0'/%3E%3Ccircle cx='16' cy='23' r='3' fill='%23ff7a1a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧控制面板 -->
    <div id="panel">
      <div class="section">
        <h2>3D 点胶控制</h2>
        <div id="status-badge" class="badge disconnected">未连接</div>
      </div>

      <div class="section">
        <h3>运动控制</h3>
        <div class="row">
          <button id="btn-home">回零</button>
          <button id="btn-estop" class="danger">急停</button>
          <button id="btn-reset" class="warn">复位报警</button>
        </div>
        <div class="row">
          <button id="btn-run" class="primary">执行点胶</button>
        </div>
      </div>

      <div class="section">
        <h3>手动控制</h3>
        <div class="jog-grid">
          <div class="jog-row">
            <label>X:</label>
            <button data-axis="x" data-dir="-1">-</button>
            <span id="x-pos" class="pos-display">0.000</span>
            <button data-axis="x" data-dir="1">+</button>
          </div>
          <div class="jog-row">
            <label>Y:</label>
            <button data-axis="y" data-dir="-1">-</button>
            <span id="y-pos" class="pos-display">0.000</span>
            <button data-axis="y" data-dir="1">+</button>
          </div>
          <div class="jog-row">
            <label>Z:</label>
            <button data-axis="z" data-dir="-1">-</button>
            <span id="z-pos" class="pos-display">0.000</span>
            <button data-axis="z" data-dir="1">+</button>
          </div>
        </div>
        <div class="row">
          <label>定位:</label>
          <select id="ptp-axis">
            <option value="x">X</option>
            <option value="y">Y</option>
            <option value="z">Z</option>
          </select>
          <input id="ptp-pos" type="number" step="1" value="0" style="width:80px" />
          <button id="btn-ptp">定位</button>
        </div>
      </div>

      <div class="section">
        <h3>传感器信号</h3>
        <div class="sensor-grid">
          <div class="sensor-row">
            <label>X:</label>
            <span class="sensor-led" id="x-home" title="零点开关">H</span>
            <span class="sensor-led" id="x-limpos" title="正极限">P</span>
            <span class="sensor-led" id="x-limneg" title="负极限">N</span>
            <span id="x-state" class="axis-state">Idle</span>
          </div>
          <div class="sensor-row">
            <label>Y:</label>
            <span class="sensor-led" id="y-home" title="零点开关">H</span>
            <span class="sensor-led" id="y-limpos" title="正极限">P</span>
            <span class="sensor-led" id="y-limneg" title="负极限">N</span>
            <span id="y-state" class="axis-state">Idle</span>
          </div>
          <div class="sensor-row">
            <label>Z:</label>
            <span class="sensor-led" id="z-home" title="零点开关">H</span>
            <span class="sensor-led" id="z-limpos" title="正极限">P</span>
            <span class="sensor-led" id="z-limneg" title="负极限">N</span>
            <span id="z-state" class="axis-state">Idle</span>
          </div>
        </div>
      </div>

      <div class="section">
        <h3>胶阀</h3>
        <button id="btn-valve" class="toggle off">胶阀: 关</button>
      </div>

      <div class="section">
        <h3>3 轴模型创建</h3>
        <div class="form-row">
          <label>机型</label>
          <select id="machine-type">
            <option value="gantry">龙门式 Gantry</option>
            <option value="cantilever">悬臂式 Cantilever</option>
            <option value="movingTable">工作台移动式</option>
          </select>
        </div>
        <div class="form-row">
          <label>X 行程</label>
          <input id="cfg-xmin" type="number" step="10" value="-150" />
          <span class="tilde">~</span>
          <input id="cfg-xmax" type="number" step="10" value="150" />
        </div>
        <div class="form-row">
          <label>Y 行程</label>
          <input id="cfg-ymin" type="number" step="10" value="-150" />
          <span class="tilde">~</span>
          <input id="cfg-ymax" type="number" step="10" value="150" />
        </div>
        <div class="form-row">
          <label>Z 行程</label>
          <input id="cfg-zmin" type="number" step="10" value="0" />
          <span class="tilde">~</span>
          <input id="cfg-zmax" type="number" step="10" value="80" />
        </div>
        <div class="form-row">
          <label>台面边长</label>
          <input id="cfg-table" type="number" step="10" value="320" />
        </div>
        <div class="form-row">
          <label>横梁高度</label>
          <input id="cfg-height" type="number" step="10" value="130" />
        </div>
        <div class="row">
          <button id="btn-build-machine" class="primary">创建 / 重建模型</button>
        </div>
        <div class="row">
          <button id="btn-sync-config">同步到服务端</button>
          <button id="btn-get-config">读取配置</button>
        </div>
        <div class="form-row checks">
          <label><input type="checkbox" id="chk-workspace" checked /> 工作空间</label>
          <label><input type="checkbox" id="chk-sensors" checked /> 传感器</label>
          <label><input type="checkbox" id="chk-labels" checked /> 轴标签</label>
        </div>
        <div class="row">
          <button id="btn-reset-view">复位视角</button>
          <button id="btn-clear-trail">清除胶路</button>
        </div>
        <div id="machine-info" class="machine-info">龙门式 · X[-150,150] Y[-150,150] Z[0,80]</div>
      </div>

      <div class="section">
        <h3>CAD 模型预览</h3>
        <input type="file" id="file-stl" accept=".stl" />
        <div class="row">
          <button id="btn-clear-model">清除模型</button>
        </div>
      </div>

      <div class="section">
        <h3>禁止区管理</h3>
        <div id="zone-list"></div>
      </div>

      <div class="section">
        <h3>日志</h3>
        <div id="log" class="log"></div>
      </div>
    </div>

    <!-- 右侧 3D 场景 -->
    <div id="canvas-container"></div>

    <!-- 撞机报警弹窗 -->
    <div id="collision-alert" class="alert hidden">
      <div class="alert-content">
        <h2>⚠ 撞机报警</h2>
        <p id="collision-msg"></p>
        <button id="btn-alert-reset" class="warn">复位并继续</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
